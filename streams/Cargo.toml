[package]
name = "zenith-streams"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1

[dependencies]
soroban-sdk = { version = "21.0.0" }
# The storage-schema migration framework every Zenith contract uses.
zenith-common = { path = "../common" }

[dev-dependencies]
soroban-sdk = { version = "21.0.0", features = ["testutils"] }
# Property-based tests for the math modules (see README "Property tests").
proptest = "1"

[features]
testutils = ["soroban-sdk/testutils"]
